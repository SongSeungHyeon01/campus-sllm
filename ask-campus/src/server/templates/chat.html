<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물어봐 캠퍼스</title>
<!-- 시험용 웹 채팅 (SCR-001 대용). 정식 UI는 Figma 설계 뒤 앱에서 만든다. 같은 POST /api/v1/ask를 쓴다 -->
<style>
  :root { --navy:#1f3a5f; --ink:#22262e; --muted:#5f6773; --line:#d5dbe3; --tint:#f3f5f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; color:var(--ink); background:#fff; font-size:15px; }
  .wrap { max-width:760px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--navy); font-size:18px; }
  select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:85%; margin:0 0 12px; padding:10px 14px; border-radius:14px; line-height:1.55; white-space:pre-wrap; word-break:keep-all; }
  .me { margin-left:auto; background:var(--navy); color:#fff; border-bottom-right-radius:4px; }
  .bot { background:var(--tint); border-bottom-left-radius:4px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; white-space:normal; }
  .meta a { color:var(--navy); }
  .fb { margin-top:8px; display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); white-space:normal; }
  .fb-btn { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--line); border-radius:12px;
            background:#fff; color:var(--muted); cursor:pointer; }
  .fb-in { flex:1; font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; }
  /* 답 본문: 줄마다 나눠 보여 준다. '· ' 줄은 들여쓰기, 여러 줄 답의 첫 줄(핵심)은 굵게 (11/21 가독성) */
  .ans .lead { font-weight:600; margin-bottom:2px; }
  .ans .li { position:relative; padding-left:14px; }
  .ans .li::before { content:"·"; position:absolute; left:3px; font-weight:700; color:var(--navy); }
  .ans .gap { height:8px; }
  .ans .sub { font-weight:600; margin-top:6px; }
  .choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; white-space:normal; }
  .choice { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--line); border-radius:16px;
            background:#fff; color:var(--navy); cursor:pointer; }
  .choice:disabled { opacity:.5; cursor:default; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #q { flex:1; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:12px; }
  button { font:inherit; padding:0 18px; border:0; border-radius:12px; background:var(--navy); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>물어봐 캠퍼스</b>
    <select id="campus" aria-label="캠퍼스"><option>아산</option><option>영동</option></select>
  </header>
  <div id="log">
    <div class="msg bot">무엇이든 물어보세요. 학사일정, 공지, 장학, 통학버스, 동아리, 학교 FAQ를 찾아서 답해 드려요.</div>
  </div>
  <form id="f">
    <input id="q" maxlength="200" placeholder="질문을 입력하세요" autocomplete="off" autofocus>
    <button id="send">보내기</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
// 되묻기(FR-027)에서 고른 학과. 이 화면을 닫기 전까지만 기억하고 서버에는 질문할 때만 보낸다
let department = null;
// 학과를 되물은 뒤 버튼 대신 입력창에 학과 이름을 적으면, 그 말을 학과로 받고 원래 질문을 다시 보낸다
let waitingDept = null;     // 학과를 되물었던 원래 질문

// 되묻기 선택지를 버튼으로. department는 학과를 기억하고 같은 질문을 다시, refine은 원래 질문에 고른 말을 붙여 다시 묻는다
function addChoices(box, clarify, original, options) {
  options = options || clarify.options;
  if (!options || !options.length) return;
  const wrap = document.createElement('div'); wrap.className = 'choices';
  for (const opt of options) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.textContent = opt;
    b.addEventListener('click', () => {
      // 학과 목록의 '전체 보기'는 다른 캠퍼스까지 학과 전체를 펼친다 (질문은 다시 보내지 않음)
      if (clarify.field === 'department' && opt === '전체 보기' && clarify.more) {
        wrap.remove(); addChoices(box, clarify, original, clarify.more); return;
      }
      wrap.querySelectorAll('button').forEach(x => x.disabled = true);
      waitingDept = null;
      if (clarify.field === 'department') { department = opt; ask(original, `${opt} 선택`); }
      else ask(opt.includes(original) ? opt : `${original} ${opt}`);
    });
    wrap.appendChild(b);
  }
  box.appendChild(wrap);
}

// 답 본문을 줄 단위로 그린다. 서버(readable.py)가 목록은 '· '로, 긴 문단은 문장마다 줄을 나눠 보낸다.
// textContent만 쓰므로 답에 HTML이 섞여 있어도 그대로 글자로 보인다
function renderAnswer(box, text) {
  box.textContent = '';
  const body = document.createElement('div'); body.className = 'ans';
  const lines = text.split('\n'), multi = lines.length >= 4;
  lines.forEach((ln, i) => {
    const d = document.createElement('div');
    if (!ln.trim()) d.className = 'gap';
    else if (ln.startsWith('· ')) { d.className = 'li'; d.textContent = ln.slice(2); }
    else {
      d.textContent = ln;
      if (i === 0 && multi && ln.length <= 60) d.className = 'lead';
      // '1. 일반휴학'처럼 번호 붙은 짧은 줄 밑에 '· ' 항목이 이어지면 소제목으로
      else if (/^(\d{1,2}|[가-하])\.\s/.test(ln) && ln.length <= 30 && (lines[i + 1] || '').startsWith('· ')) d.className = 'sub';
    }
    body.appendChild(d);
  });
  box.appendChild(body);
}

// '답이 이상해요': 누르면 무엇이 틀렸는지 한 줄 적게 하고, 관리 웹 '답변 피드백'으로 보낸다
function addFeedback(box, logId) {
  const wrap = document.createElement('div'); wrap.className = 'fb';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'fb-btn'; b.textContent = '답이 이상해요';
  b.addEventListener('click', () => {
    b.remove();
    const input = document.createElement('input'); input.maxLength = 300; input.className = 'fb-in';
    input.placeholder = '무엇이 틀렸나요? (선택)';
    const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'fb-btn'; ok.textContent = '보내기';
    ok.addEventListener('click', async () => {
      ok.disabled = true;
      try {
        await fetch('/api/v1/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ log_id: logId, comment: input.value.trim() }) });
        wrap.textContent = '알려 주셔서 고마워요. 확인해서 고칠게요.';
      } catch (e) { wrap.textContent = '보내지 못했어요.'; }
    });
    wrap.append(input, ok); input.focus();
  });
  wrap.appendChild(b); box.appendChild(wrap);
}

async function ask(text, shown) {
  add('me', shown || text); send.disabled = true;
  const wait = add('bot', '답을 찾는 중…');
  try {
    const r = await fetch('/api/v1/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, campus: document.getElementById('campus').value, department }) });
    const d = await r.json();
    if (!r.ok) { wait.textContent = (d.error && d.error.message) || '오류가 났어요.'; return; }
    renderAnswer(wait, d.answer);
    if (d.clarify) {
      waitingDept = d.clarify.field === 'department' ? text : null;
      addChoices(wait, d.clarify, text); return;
    }
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.append(`${d.answer_type} · ${(d.elapsed_ms / 1000).toFixed(1)}초`);
    for (const s of d.sources || []) {
      meta.append(' · ');
      if (s.source_url) { const a = document.createElement('a'); a.href = s.source_url; a.target = '_blank';
        a.rel = 'noopener'; a.textContent = s.label || s.title; meta.append(a); }
      else meta.append(s.label || s.title);
    }
    wait.appendChild(meta);
    if (d.log_id) addFeedback(wait, d.log_id);
  } catch (err) { wait.textContent = '서버에 연결하지 못했어요.'; }
  finally { send.disabled = false; q.focus(); log.scrollTop = log.scrollHeight; }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  if (waitingDept && text.length <= 20) {          // 되물은 학과에 대한 답으로 본다
    const original = waitingDept; waitingDept = null;
    document.querySelectorAll('.choices button').forEach(x => x.disabled = true);
    department = text; ask(original, text); return;
  }
  waitingDept = null; ask(text);
});
document.getElementById('campus').addEventListener('change', () => { department = null; });   // 캠퍼스가 바뀌면 학과도 다시 묻는다
</script>
</body>
</html>
