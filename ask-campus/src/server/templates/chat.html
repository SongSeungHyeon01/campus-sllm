<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물어봐 캠퍼스</title>
<!-- 시험용 웹 채팅 (SCR-001 대용). 정식 UI는 Figma 설계 뒤 앱에서 만든다. 같은 POST /api/v1/ask를 쓴다 -->
<style>
  :root { --navy:#1f3a5f; --ink:#22262e; --muted:#5f6773; --line:#d5dbe3; --tint:#f3f5f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; color:var(--ink); background:#fff; font-size:15px; }
  .wrap { max-width:760px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--navy); font-size:18px; }
  select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:85%; margin:0 0 12px; padding:10px 14px; border-radius:14px; line-height:1.55; white-space:pre-wrap; word-break:keep-all; }
  .me { margin-left:auto; background:var(--navy); color:#fff; border-bottom-right-radius:4px; }
  .bot { background:var(--tint); border-bottom-left-radius:4px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; white-space:normal; }
  .meta a { color:var(--navy); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #q { flex:1; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:12px; }
  button { font:inherit; padding:0 18px; border:0; border-radius:12px; background:var(--navy); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>물어봐 캠퍼스</b>
    <select id="campus" aria-label="캠퍼스"><option>아산</option><option>영동</option></select>
  </header>
  <div id="log">
    <div class="msg bot">무엇이든 물어보세요. 학사일정, 공지, 장학, 통학버스, 동아리, 학교 FAQ를 찾아서 답해 드려요.</div>
  </div>
  <form id="f">
    <input id="q" maxlength="200" placeholder="질문을 입력하세요" autocomplete="off" autofocus>
    <button id="send">보내기</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  add('me', text); q.value = ''; send.disabled = true;
  const wait = add('bot', '답을 찾는 중…');
  try {
    const r = await fetch('/api/v1/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, campus: document.getElementById('campus').value }) });
    const d = await r.json();
    if (!r.ok) { wait.textContent = (d.error && d.error.message) || '오류가 났어요.'; return; }
    wait.textContent = d.answer;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.append(`${d.answer_type} · ${(d.elapsed_ms / 1000).toFixed(1)}초`);
    for (const s of d.sources || []) {
      meta.append(' · ');
      if (s.source_url) { const a = document.createElement('a'); a.href = s.source_url; a.target = '_blank';
        a.rel = 'noopener'; a.textContent = s.label || s.title; meta.append(a); }
      else meta.append(s.label || s.title);
    }
    wait.appendChild(meta);
  } catch (err) { wait.textContent = '서버에 연결하지 못했어요.'; }
  finally { send.disabled = false; q.focus(); log.scrollTop = log.scrollHeight; }
});
</script>
</body>
</html>
