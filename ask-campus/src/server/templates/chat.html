<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물어봐 캠퍼스</title>
<!-- 학생 웹 채팅 (SCR-001). Figma '물어봐 캠퍼스 UI' 학생 채팅 시안 00~09를 따른다 (문서/보고서/개발문서/UI디자인_인수인계서.md).
     같은 POST /api/v1/ask, /api/v1/feedback을 쓴다. 학교 로고는 사용 허가 전이라 넣지 않는다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Figma 변수 컬렉션 "Color"와 이름을 맞춘다 */
  :root {
    --bg-lavender:#EFF3FE; --bg-surface:#FFFFFF; --bg-callout:#E5EDFF;
    --primary:#2F5BD3; --primary-soft:#C9D8FF;
    --text-ink:#1A1D26; --text-muted:#687083; --text-on-primary:#FFFFFF; --line:#E1E6F0;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; color:var(--text-ink);
         background:var(--bg-lavender); font-size:16px; -webkit-font-smoothing:antialiased; }
  button, input, textarea, select { font:inherit; color:inherit; }
  .app { max-width:480px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column;
         background:var(--bg-lavender); position:relative; overflow:hidden; }
  @media (min-width:560px) {
    body { background:#DCE3F5; }
    .app { height:min(844px, calc(100vh - 48px)); max-width:390px; margin:24px auto; border-radius:32px;
           box-shadow:0 12px 40px rgba(26,29,38,.16); }
  }
  [hidden] { display:none !important; }

  /* 00 시작 화면 */
  .splash { position:absolute; inset:0; z-index:30; background:var(--bg-lavender); display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:28px; transition:opacity .35s; }
  .splash img { width:56%; max-width:240px; }
  .splash h1 { margin:0; color:var(--primary); font-size:34px; font-weight:700; letter-spacing:-.5px; }
  .splash.out { opacity:0; pointer-events:none; }

  /* 01 캠퍼스 선택 (첫 실행) */
  .onboard { position:absolute; inset:0; z-index:20; background:var(--bg-lavender); display:flex; flex-direction:column;
             padding:56px 24px 24px; }
  .onboard h2 { margin:0 0 14px; font-size:28px; line-height:1.35; font-weight:700; }
  .onboard p { margin:0 0 36px; color:var(--text-muted); font-size:15px; line-height:1.6; }
  .campus-card { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
                 background:var(--bg-surface); border:1.5px solid var(--line); border-radius:20px; padding:22px 24px;
                 margin-bottom:14px; cursor:pointer; }
  .campus-card b { display:block; font-size:18px; margin-bottom:4px; }
  .campus-card span { color:var(--text-muted); font-size:14px; }
  .campus-card .radio { width:28px; height:28px; border-radius:50%; border:2px solid var(--line); flex:none;
                        display:grid; place-items:center; }
  .campus-card[aria-checked="true"] { border:2px solid var(--primary); }
  .campus-card[aria-checked="true"] .radio { background:var(--primary); border-color:var(--primary); }
  .campus-card[aria-checked="true"] .radio::after { content:""; width:10px; height:6px; border:2.5px solid #fff;
                 border-top:0; border-right:0; transform:translateY(-1px) rotate(-45deg); }
  .onboard .spacer { flex:1; }
  .btn-primary { width:100%; border:0; border-radius:16px; background:var(--primary); color:var(--text-on-primary);
                 font-size:17px; font-weight:700; padding:17px; cursor:pointer; }
  .btn-primary:disabled { opacity:.5; cursor:default; }

  /* ChatHeader(campus) */
  header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 12px; }
  header .title { font-weight:700; font-size:21px; letter-spacing:-.3px; }
  .campus-pill { position:relative; }
  .campus-pill select { appearance:none; -webkit-appearance:none; border:0; border-radius:999px; background:var(--bg-surface);
                        color:var(--primary); font-size:15px; font-weight:500; padding:8px 34px 8px 16px; cursor:pointer; }
  .campus-pill::after { content:""; position:absolute; right:15px; top:50%; width:7px; height:7px; margin-top:-6px;
                        border:2px solid var(--primary); border-top:0; border-left:0; transform:rotate(45deg); pointer-events:none; }

  #log { flex:1; overflow-y:auto; padding:8px 20px 20px; }

  /* 02 첫 화면 */
  .home h2 { margin:32px 0 10px; font-size:30px; font-weight:700; letter-spacing:-.5px; }
  .home .lead { margin:0 0 26px; color:var(--text-muted); font-size:16px; line-height:1.6; }
  .home .label { color:var(--text-muted); font-size:14px; font-weight:500; margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { border:1px solid var(--line); border-radius:999px; background:var(--bg-surface); color:var(--primary);
          font-size:16px; font-weight:500; padding:10px 20px; cursor:pointer; }
  .chip:hover { border-color:var(--primary-soft); }
  .chip.on { background:var(--primary); border-color:var(--primary); color:var(--text-on-primary); }
  .chip:disabled:not(.on) { opacity:.45; cursor:default; }
  .callout { background:var(--bg-callout); color:var(--primary); border-radius:16px; padding:16px 20px;
             font-size:15px; line-height:1.6; margin-top:22px; }

  /* 말풍선 */
  .row { display:flex; gap:12px; align-items:flex-start; margin:0 0 20px; }
  .row.me { justify-content:flex-end; }
  .me .msg { max-width:80%; background:var(--primary); color:var(--text-on-primary); padding:12px 20px;
             border-radius:22px 22px 6px 22px; font-size:17px; line-height:1.5; white-space:pre-wrap; word-break:keep-all; }
  /* BotAvatar */
  .avatar { flex:none; width:44px; height:44px; border-radius:14px; background:var(--primary); display:grid; place-items:center; }
  .bot .msg { flex:1; min-width:0; background:var(--bg-surface); border-radius:22px; padding:20px 22px; line-height:1.6;
              word-break:keep-all; }
  .note { color:var(--text-muted); font-size:14px; line-height:1.7; margin:-6px 0 20px 8px; }

  /* 03 답을 찾는 중 */
  .loading { display:flex; align-items:center; gap:12px; color:var(--text-muted); font-weight:700; font-size:16px; }
  .dots { display:inline-flex; gap:6px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:var(--primary-soft); animation:blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { background:var(--primary-soft); } 40% { background:var(--primary); } }
  .loading-sub { color:var(--text-muted); font-size:14px; margin-top:12px; }

  /* 04 답변: 첫 줄은 굵게, '· ' 줄은 파란 점 목록 */
  .ans { font-size:16px; }
  .ans .head { font-weight:700; font-size:17px; margin-bottom:6px; }
  .ans .muted { color:var(--text-muted); }
  .ans .li { position:relative; padding-left:20px; margin:8px 0; }
  .ans .li::before { content:""; position:absolute; left:2px; top:.62em; width:7px; height:7px; border-radius:50%; background:var(--primary); }
  .ans .gap { height:8px; }
  .ans .sub { font-weight:700; margin-top:8px; }
  .src { display:block; background:var(--bg-lavender); border-radius:16px; padding:16px 20px; margin-top:16px; }
  .src .top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .tag { flex:none; background:var(--primary-soft); color:var(--primary); font-size:13px; font-weight:700;
         border-radius:8px; padding:3px 9px; }
  .src .t { font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .src .m { color:var(--text-muted); font-size:14px; overflow-wrap:anywhere; }
  .src a { display:inline-block; margin-top:8px; color:var(--primary); font-weight:700; text-decoration:none; }
  .src a::after { content:""; display:inline-block; width:7px; height:7px; margin-left:8px; border:2px solid var(--primary);
                  border-left:0; border-bottom:0; transform:rotate(45deg); vertical-align:2px; }
  .fb-row { display:flex; justify-content:flex-end; margin-top:16px; }
  .fb-btn { border:1px solid var(--line); border-radius:999px; background:var(--bg-surface); color:var(--text-muted);
            font-size:15px; padding:9px 18px; cursor:pointer; }
  .sent { display:flex; align-items:center; gap:8px; color:var(--primary); font-size:15px; font-weight:500; margin-top:12px; }
  .sent .ok { width:22px; height:22px; border-radius:50%; background:var(--primary); display:grid; place-items:center; flex:none; }
  .sent .ok::after { content:""; width:8px; height:4px; border:2px solid #fff; border-top:0; border-right:0;
                     transform:translateY(-1px) rotate(-45deg); }

  /* 05·06 되묻기 */
  .ask-q { font-weight:700; font-size:17px; margin-bottom:14px; }
  .hint { color:var(--text-muted); font-size:14px; margin-top:14px; }

  /* 07 찾지 못했을 때 */
  .dept { background:var(--bg-lavender); border-radius:16px; padding:16px 20px; margin-top:16px; }
  .dept small { display:block; color:var(--primary); font-weight:700; font-size:14px; margin-bottom:6px; }
  .dept b { font-size:17px; }
  .dept .m { color:var(--text-muted); font-size:15px; margin-top:4px; }

  /* InputBar(placeholder) */
  form.input { display:flex; gap:12px; align-items:center; padding:16px 20px calc(16px + env(safe-area-inset-bottom));
               background:var(--bg-surface); border-top:1px solid var(--line); }
  #q { flex:1; min-width:0; border:0; outline:0; background:var(--bg-lavender); border-radius:999px; padding:16px 22px;
       font-size:17px; }
  #q::placeholder { color:var(--text-muted); }
  .send { flex:none; width:56px; height:56px; border-radius:50%; border:0; background:var(--primary); display:grid;
          place-items:center; cursor:pointer; }
  .send:disabled { opacity:.5; cursor:default; }

  /* 08 의견 시트 */
  .dim { position:absolute; inset:0; z-index:10; background:rgba(26,29,38,.38); display:none; align-items:flex-end; }
  .dim.open { display:flex; }
  .sheet { width:100%; background:var(--bg-surface); border-radius:28px 28px 0 0; padding:14px 24px calc(24px + env(safe-area-inset-bottom)); }
  .sheet .handle { width:48px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 22px; }
  .sheet h3 { margin:0 0 12px; font-size:24px; font-weight:700; }
  .sheet p { margin:0 0 22px; color:var(--text-muted); font-size:15px; line-height:1.6; }
  .sheet textarea { width:100%; height:150px; border:0; outline:0; background:var(--bg-lavender); border-radius:16px;
                    padding:16px 20px; font-size:16px; resize:none; }
  .sheet textarea::placeholder { color:var(--text-muted); }
  .sheet .count { text-align:right; color:var(--text-muted); font-size:14px; margin:12px 0 18px; }
</style>
</head>

      <p class="lead">학사일정, 공지, 장학, 통학버스, 학식, 동아리를<br>학교 홈페이지에서 찾아 답해 드려요.</p>
      <div class="label">이런 걸 많이 물어봐요</div>
      <div class="chips" id="suggest"></div>
      <div class="callout">답에는 찾은 홈페이지 글이 함께 나와요. 중요한 일정은 원문에서 한 번 더 확인해 주세요.</div>
    </section>
  </div>
  <form id="f" class="input">
    <input id="q" maxlength="200" placeholder="궁금한 걸 물어보세요" autocomplete="off" aria-label="질문">
    <button id="send" class="send" aria-label="보내기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>

  <!-- 08 의견 시트 -->
  <div class="dim" id="dim">
    <div class="sheet" role="dialog" aria-labelledby="sheet-title">
      <div class="handle"></div>
      <h3 id="sheet-title">답이 어디가 이상했나요?</h3>
      <p>적어 주시면 관리자가 확인해서 고쳐요.<br>비워 두고 보내도 돼요.</p>
      <textarea id="fb-text" maxlength="300" placeholder="예) 날짜가 올해 일정이 아니에요"></textarea>
      <div class="count"><span id="fb-count">0</span> / 300</div>
      <button type="button" class="btn-primary" id="fb-send">보내기</button>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), q = $('q'), send = $('send'), campusSel = $('campus');
const AVATAR = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M5 3h14a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-8l-5 4v-4H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><circle cx="9" cy="10.5" r="1.4" fill="#2F5BD3"/><circle cx="15" cy="10.5" r="1.4" fill="#2F5BD3"/></svg>';

// 캠퍼스는 이 기기 브라우저에만 저장한다 (2.6). 저장소를 못 쓰면 매번 묻는다
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// 02 추천 질문 칩 (화면에 고정. 서버 추천 질문 API는 아직 없음, FR-006)
function renderSuggest() {
  const bus = campusSel.value === '영동' ? '다음 통학버스 언제야?' : '다음 천안역 버스 언제야?';
  const box = $('suggest'); box.textContent = '';
  for (const s of [bus, '오늘 학식 메뉴', '휴학 신청 기간', '국가장학금 신청', '수강정정 언제까지야?']) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s;
    b.addEventListener('click', () => ask(s)); box.appendChild(b);
  }
}

// 00 → 01(첫 실행만) → 02
const saved = store.get('campus');
if (saved) campusSel.value = saved;
renderSuggest();
setTimeout(() => {
  $('splash').classList.add('out');
  if (!saved) $('onboard').hidden = false; else q.focus();
}, 1100);
let picked = '아산';
document.querySelectorAll('.campus-card').forEach(c => c.addEventListener('click', () => {
  picked = c.dataset.campus;
  document.querySelectorAll('.campus-card').forEach(x => x.setAttribute('aria-checked', x === c));
}));
$('start').addEventListener('click', () => {
  campusSel.value = picked; store.set('campus', picked); renderSuggest();
  $('onboard').hidden = true; q.focus();
});

function addRow(cls) {
  const home = $('home'); if (home) home.remove();
  const row = document.createElement('div'); row.className = 'row ' + cls;
  if (cls === 'bot') { const a = document.createElement('div'); a.className = 'avatar'; a.innerHTML = AVATAR; row.appendChild(a); }
  const d = document.createElement('div'); d.className = 'msg'; row.appendChild(d);
  log.appendChild(row); log.scrollTop = log.scrollHeight; return d;
}
function addMe(text) { addRow('me').textContent = text; }

// 되묻기(FR-027)에서 고른 학과. 이 화면을 닫기 전까지만 기억하고 서버에는 질문할 때만 보낸다
let department = null;
// 학과를 되물은 뒤 버튼 대신 입력창에 학과 이름을 적으면, 그 말을 학과로 받고 원래 질문을 다시 보낸다
let waitingDept = null;

// 05·06 되묻기 선택지. department는 학과를 기억하고 같은 질문을 다시, refine은 원래 질문에 고른 말을 붙여 다시 묻는다
function addChoices(box, clarify, original, options) {
  options = options || clarify.options;
  if (!options || !options.length) return;
  const wrap = document.createElement('div'); wrap.className = 'chips';
  for (const opt of options) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = opt;
    b.addEventListener('click', () => {
      // 학과 목록의 '전체 보기'는 다른 캠퍼스까지 학과 전체를 펼친다 (질문은 다시 보내지 않음)
      if (clarify.field === 'department' && opt === '전체 보기' && clarify.more) {
        const hint = box.querySelector('.hint'); wrap.remove();
        addChoices(box, clarify, original, clarify.more); if (hint) box.appendChild(hint); return;
      }
      wrap.querySelectorAll('button').forEach(x => x.disabled = true); b.classList.add('on');
      waitingDept = null;
      if (clarify.field === 'department') { department = opt; ask(original, opt); }
      else ask(opt.includes(original) ? opt : `${original} ${opt}`, opt);
    });
    wrap.appendChild(b);
  }
  box.appendChild(wrap);
}

// 답 본문을 줄 단위로 그린다. 서버(readable.py)가 목록은 '· '로, 긴 문단은 문장마다 줄을 나눠 보낸다.
// 첫 줄(핵심)은 굵게. textContent만 쓰므로 답에 HTML이 섞여 있어도 그대로 글자로 보인다
function renderAnswer(box, text, opts = {}) {
  box.textContent = '';
  const body = document.createElement('div'); body.className = 'ans';
  const lines = text.split('\n');
  lines.forEach((ln, i) => {
    const d = document.createElement('div');
    if (!ln.trim()) d.className = 'gap';
    else if (ln.startsWith('· ')) { d.className = 'li'; d.textContent = ln.slice(2); }
    else {
      d.textContent = ln;
      if (i === 0) d.className = 'head';
      else if (opts.mutedRest) d.className = 'muted';
      // '1. 일반휴학'처럼 번호 붙은 짧은 줄 밑에 '· ' 항목이 이어지면 소제목으로
      else if (/^(\d{1,2}|[가-하])\.\s/.test(ln) && ln.length <= 30 && (lines[i + 1] || '').startsWith('· ')) d.className = 'sub';
    }
    body.appendChild(d);
  });
  box.appendChild(body);
}

// 출처 카드: 종류 · 제목, 메뉴 위치 · 수집일, 원문 보기 (FR-004, FR-007, FR-022)
function addSources(box, sources) {
  for (const s of sources || []) {
    const c = document.createElement('div'); c.className = 'src';
    const top = document.createElement('div'); top.className = 'top';
    if (s.kind) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = s.kind; top.appendChild(t); }
    const t = document.createElement('span'); t.className = 't'; t.textContent = s.label || s.title; top.appendChild(t);
    c.appendChild(top);
    const meta = [];
    // 메뉴 경로에 주소 조각('/u1/...do')이 섞인 자료가 있어 그 조각은 빼고 보여 준다
    const path = (s.menu_path || '').split('>').map(x => x.trim()).filter(x => x && x !== '홈' && !x.startsWith('/') && !/\.(do|php|jsp|html?)\b/.test(x));
    if (path.length) meta.push(path.join(' › '));
    if (s.collected_at) { const [, m, d] = s.collected_at.slice(0, 10).split('-'); meta.push(`수집일 ${+m}월 ${+d}일`); }
    if (meta.length) { const m = document.createElement('div'); m.className = 'm'; m.textContent = meta.join(' · '); c.appendChild(m); }
    if (s.source_url) {
      const a = document.createElement('a'); a.href = s.source_url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '원문 보기';
      c.appendChild(a);
    }
    box.appendChild(c);
  }
}

// 07 찾지 못했을 때: 서버가 담당 부서를 알면 '· 이 내용은 OO에 문의하면 됩니다.' 줄을 붙여 보낸다
function renderNotFound(box, text) {
  const m = text.match(/\n·\s*이 내용은\s*(.+?)에 문의하면 됩니다\.?\s*$/);
  const main = m ? text.slice(0, m.index) : text;
  const parts = main.split(/(?<=\.)\s+/);
  renderAnswer(box, parts.join('\n'), { mutedRest: true });
  if (m) {
    const d = document.createElement('div'); d.className = 'dept';
    const s = document.createElement('small'); s.textContent = '담당 부서';
    const [, name, tel] = m[1].match(/^(.+?)\s*(?:\((.+)\))?$/);     // '생활관 (043-...)' → 이름, 전화
    const b = document.createElement('b'); b.textContent = name;
    d.append(s, b);
    if (tel) { const t = document.createElement('div'); t.className = 'm'; t.textContent = tel; d.appendChild(t); }
    box.appendChild(d);
  }
}

// 08 의견 시트 → 09 보낸 뒤
const dim = $('dim'), fbText = $('fb-text'), fbCount = $('fb-count'), fbSend = $('fb-send');
let fbLogId = null, fbRow = null;
function openSheet(logId, row) {
  fbLogId = logId; fbRow = row; fbText.value = ''; fbCount.textContent = '0'; fbSend.disabled = false;
  dim.classList.add('open'); setTimeout(() => fbText.focus(), 50);
}
function closeSheet() { dim.classList.remove('open'); }
fbText.addEventListener('input', () => { fbCount.textContent = fbText.value.length; });
dim.addEventListener('click', (e) => { if (e.target === dim) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
fbSend.addEventListener('click', async () => {
  fbSend.disabled = true;
  try {
    const r = await fetch('/api/v1/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ log_id: fbLogId, comment: fbText.value.trim() }) });
    if (!r.ok) throw new Error();
    closeSheet();
    const s = document.createElement('div'); s.className = 'sent';
    s.innerHTML = '<span class="ok"></span>'; s.append('알려 주셔서 고마워요. 확인해서 고칠게요.');
    fbRow.replaceWith(s);
  } catch (e) { fbSend.disabled = false; alert('보내지 못했어요. 다시 시도해 주세요.'); }
});

async function ask(text, shown) {
  addMe(shown || text); send.disabled = true;
  const wait = addRow('bot');
  wait.innerHTML = '<div class="loading"><span class="dots"><i></i><i></i><i></i></span>학교 홈페이지에서 찾는 중이에요</div>'
                 + '<div class="loading-sub">길게는 10초 넘게 걸릴 수 있어요.</div>';
  try {
    const r = await fetch('/api/v1/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, campus: campusSel.value, department }) });
    const d = await r.json();
    if (!r.ok) { wait.textContent = (d.error && d.error.message) || '오류가 났어요.'; return; }
    if (d.clarify) {
      wait.textContent = '';
      const h = document.createElement('div'); h.className = 'ask-q'; h.textContent = d.answer; wait.appendChild(h);
      waitingDept = d.clarify.field === 'department' ? text : null;
      addChoices(wait, d.clarify, text);
      if (d.clarify.field === 'department') {
        const hint = document.createElement('div'); hint.className = 'hint';
        hint.textContent = '목록에 없으면 학과 이름을 바로 적어도 돼요.'; wait.appendChild(hint);
        const note = document.createElement('div'); note.className = 'note';
        note.innerText = '· 고른 학과는 이 대화에서만 기억해요.\n· 캠퍼스를 바꾸면 학과를 다시 물어봐요.';
        wait.parentElement.after(note);
      }
      return;
    }
    if (d.answer_type === '근거없음') renderNotFound(wait, d.answer);
    else { renderAnswer(wait, d.answer); addSources(wait, d.sources); }
    wait.title = `${d.answer_type} · ${(d.elapsed_ms / 1000).toFixed(1)}초`;
    if (d.log_id) {
      const row = document.createElement('div'); row.className = 'fb-row';
      const b = document.createElement('button'); b.type = 'button'; b.className = 'fb-btn'; b.textContent = '답이 이상해요';
      b.addEventListener('click', () => openSheet(d.log_id, row));
      row.appendChild(b); wait.appendChild(row);
    }
  } catch (err) { wait.textContent = '서버에 연결하지 못했어요. 잠시 뒤 다시 보내 주세요.'; }
  finally { send.disabled = false; q.focus(); log.scrollTop = log.scrollHeight; }
}

$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  if (waitingDept && text.length <= 20) {          // 되물은 학과에 대한 답으로 본다
    const original = waitingDept; waitingDept = null;
    document.querySelectorAll('.chips button').forEach(x => x.disabled = true);
    department = text; ask(original, text); return;
  }
  waitingDept = null; ask(text);
});
// 캠퍼스가 바뀌면 저장하고, 학과도 다시 묻는다
campusSel.addEventListener('change', () => { department = null; store.set('campus', campusSel.value); if ($('home')) renderSuggest(); });
</script>
</body>
</html>
