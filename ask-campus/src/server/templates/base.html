<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}답변·운영 관리{% endblock %} · 물어봐 캠퍼스</title>
<style>
  :root { --navy:#1f3a5f; --ink:#22262e; --muted:#5f6773; --line:#d5dbe3; --tint:#f3f5f8; --accent:#c8553d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; color:var(--ink); background:#fff; font-size:15px; }
  .layout { display:flex; min-height:100vh; }
  nav { width:200px; background:var(--tint); padding:24px 14px; flex-shrink:0; }
  nav .brand { font-weight:700; color:var(--navy); margin:0 8px 24px; line-height:1.4; }
  nav a { display:block; padding:10px 12px; border-radius:8px; color:var(--ink); text-decoration:none; margin-bottom:4px; }
  nav a.on { background:var(--navy); color:#fff; font-weight:700; }
  nav form { margin-top:24px; }
  main { flex:1; padding:32px 40px; max-width:1100px; }
  h1 { color:var(--navy); font-size:26px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .cards { display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .card { border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:170px; }
  .card .k { color:var(--muted); font-size:13px; } .card .v { font-size:24px; font-weight:700; margin-top:4px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--navy); color:#fff; text-align:left; padding:10px 12px; font-weight:600; font-size:14px; }
  td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:nth-child(even) td { background:var(--tint); }
  .btn { display:inline-block; border:1px solid var(--navy); background:#fff; color:var(--navy); padding:7px 14px;
         border-radius:8px; text-decoration:none; font:inherit; font-size:14px; cursor:pointer; }
  .btn.primary { background:var(--navy); color:#fff; }
  .btn.ghost { border-color:var(--line); color:var(--muted); }
  label { display:block; font-weight:700; margin:18px 0 6px; }
  input[type=text], input[type=password], textarea, select { width:100%; padding:10px 12px; border:1px solid var(--line);
         border-radius:8px; font:inherit; }
  textarea { min-height:160px; resize:vertical; }
  .notice { background:var(--tint); border-radius:8px; padding:12px 14px; margin:18px 0; color:var(--muted); font-size:14px; }
  .ok { background:#e3f4e8; color:#22703a; border-radius:8px; padding:12px 14px; margin-bottom:18px; }
  .empty { color:var(--muted); padding:28px 0; }
  .row-actions { display:flex; gap:8px; white-space:nowrap; }
  .row-actions form { margin:0; }
  @media (max-width:760px) { .layout { flex-direction:column; } nav { width:auto; } main { padding:20px 16px; } }
</style>
</head>
<body>
{% block body %}
<div class="layout">
  <nav>
    <div class="brand">물어봐 캠퍼스<br>답변·운영 관리</div>
    <a href="/admin" class="{{ 'on' if menu == 'pending' }}">답변 대기</a>
    <a href="/admin/faqs" class="{{ 'on' if menu == 'faqs' }}">FAQ 관리</a>
    <form method="post" action="/admin/logout"><button class="btn ghost" type="submit">로그아웃</button></form>
  </nav>
  <main>{% block main %}{% endblock %}</main>
</div>
{% endblock %}
</body>
</html>
